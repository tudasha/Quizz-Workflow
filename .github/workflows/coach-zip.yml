name: Coach zip

# Members only ever get what is on main: each push to main that changes coach/
# rebuilds fs-quiz-coach.zip and the web chat .md files and replaces the files of the
# coach-latest release.
on:
  push:
    branches: [main]
    paths:
      - "coach/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coach-zip
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coach/general/tools/requirements.txt
      - name: Install
        run: pip install -r coach/general/tools/requirements.txt
      - name: Build the zip and the chat files
        working-directory: coach/general/tools
        run: python build_zip.py --out "$GITHUB_WORKSPACE/dist" --version "${GITHUB_SHA::7}"
      - name: Publish as the coach-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release with a fixed tag keeps the download link the same for every version.
          gh release delete coach-latest --cleanup-tag --yes || true
          gh release create coach-latest dist/*.zip dist/*.md \
            --target "$GITHUB_SHA" \
            --title "FS Quiz coach $(date -u +%Y-%m-%d)" \
            --notes-file dist/release-notes.txt \
            --latest=false
