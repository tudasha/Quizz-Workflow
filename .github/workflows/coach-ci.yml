name: Coach CI

# Checks the coach content on every PR that touches it: tool tests, problem labels,
# every solution.py against its answer, the key-value quotes against the rules, and a
# preview of the zip.
on:
  pull_request:
    paths:
      - "coach/**"
      - ".github/workflows/coach-*.yml"
  push:
    branches: [dev, main]
    paths:
      - "coach/**"
      - ".github/workflows/coach-*.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coach/general/tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coach/general/tools/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Tool tests
        run: python -m pytest -q
      - name: Problems and solutions
        run: python check_problems.py
      - name: Key values still match the rules
        run: python check_key_values.py
      - name: Build the zip
        run: python build_zip.py --out "$GITHUB_WORKSPACE/dist" --version "${GITHUB_SHA::7}"
      - name: Keep the zip for download
        uses: actions/upload-artifact@v4
        with:
          name: fs-quiz-coach-preview
          path: dist/
          retention-days: 14
